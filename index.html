<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jardin Numérique | Bruno Duvocelle</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Lora:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcfaf7;
            --text-primary: #3c3c3c;
            --text-secondary: #7a7a7a;
            --accent-green: #6a9955;
            --accent-fuchsia: #d946ef; /* Fuchsia lumineux */
            --accent-gold: #c2a878;
            --border-light: #e0dcd7;
            --shadow-subtle: 0 4px 12px rgba(217, 70, 239, 0.08); /* Ombre teintée fuchsia */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Lora', serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .garden-console {
            width: 90%;
            max-width: 980px;
            background: white;
            border: 1px solid var(--border-light);
            border-top: 4px solid var(--accent-fuchsia); /* Rappel fuchsia discret */
            box-shadow: var(--shadow-subtle);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .garden-console::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path fill="%23fdf4ff" d="M30 0L0 30L70 100L100 70L30 0Z"/><path fill="%23fdf4ff" d="M70 0L100 30L30 100L0 70L70 0Z"/></svg>');
            background-size: 80px;
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
        }

        .header-floral {
            padding: 1.8rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            position: relative;
            z-index: 1;
        }

        .header-floral h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            letter-spacing: 1px;
        }

        .header-floral p {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-fuchsia);
            font-weight: 600;
        }

        .nav-grid-floral {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            position: relative;
            z-index: 1;
        }

        .nav-item-floral {
            padding: 3rem 1rem;
            text-decoration: none;
            color: var(--text-primary);
            border-right: 1px solid var(--border-light);
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: transparent;
        }

        .nav-item-floral:last-child { border-right: none; }

        .nav-item-floral:hover {
            background: rgba(217, 70, 239, 0.03);
            transform: translateY(-2px);
        }

        .nav-item-floral .title-floral {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            transition: color 0.3s ease;
        }

        .nav-item-floral:hover .title-floral {
            color: var(--accent-fuchsia);
        }

        .nav-item-floral .desc-floral {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-style: italic;
            opacity: 0.8;
        }

        .footer-floral {
            padding: 1.2rem 2.5rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-light);
            background: white;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 900px) {
            .nav-grid-floral { grid-template-columns: 1fr; }
            .nav-item-floral { border-right: none; border-bottom: 1px solid var(--border-light); padding: 2rem; }
            body { height: auto; padding: 2rem 0; overflow-y: auto; }
            .garden-console { height: auto; }
        }
    </style>
</head>
<body>

    <div class="garden-console">
        <header class="header-floral">
            <h1>Bruno Duvocelle</h1>
            <p>Architecture & Innovation</p>
        </header>

        <nav class="nav-grid-floral" id="nav-hub">
            </nav>

        <footer class="footer-floral">
            <span>&copy; 2026 Collection Digitale</span>
            <span style="color: var(--accent-fuchsia)">●</span>
            <span>Design Épuré</span>
        </footer>
    </div>

    <script>
        {
            const links = [
                { title: "AFP-Pro", desc: "Solutions Médias", url: "https://brunoduvocelle.github.io/AFP-Pro/" },
                { title: "Mesures", desc: "Analyse Capteurs", url: "https://brunoduvocelle.github.io/mesures-smartphone/" },
                { title: "Info Local", desc: "Données de Proximité", url: "https://brunoduvocelle.github.io/Info_Local/" },
                { title: "Test API", desc: "Validation Technique", url: "https://brunoduvocelle.github.io/Test-api/" },
                { title: "Météo Vélo", desc: "Mobilité Douce", url: "https://brunoduvocelle.github.io/meteo-Velo/" }
            ];

            const nav = document.getElementById('nav-hub');
            nav.innerHTML = links.map(l => `
                <a href="${l.url}" target="_blank" class="nav-item-floral">
                    <h2 class="title-floral">${l.title}</h2>
                    <p class="desc-floral">${l.desc}</p>
                </a>
            `).join('');
        }
    </script>
</body>
</html>
